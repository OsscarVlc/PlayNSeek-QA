name: CI

# Corre en cada push y en cada PR hacia main o dev.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  calidad:
    name: Quality gates
    runs-on: ubuntu-latest

    # Todos los comandos "run" se ejecutan dentro de BACKEND.
    defaults:
      run:
        working-directory: BACKEND

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          # SonarCloud necesita el historial completo para atribuir los cambios.
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json

      # Gate 1: instalación reproducible desde el lockfile.
      - name: Instalar dependencias (npm ci)
        run: npm ci --ignore-scripts

      # Gate 2: estándares de código y tipos.
      - name: Lint (ESLint)
        run: npm run lint

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Tipos (TypeScript)
        run: npx tsc --noEmit

      # Gate 3 y 4: todas las pruebas pasan y la cobertura no baja del umbral
      # definido en jest.config.js.
      - name: Pruebas y cobertura (Jest)
        run: npx jest --coverage --ci

      # Gate 5: sin vulnerabilidades críticas en dependencias de producción.
      # Temporalmente no bloquea: se vuelve bloqueante al cerrar PNSQ-30.
      - name: Auditoría de dependencias (npm audit)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true

      # Gate 6: análisis estático en SonarCloud con la cobertura de Jest.
      # Solo corre cuando el secreto SONAR_TOKEN está configurado en el repo.
      - name: Análisis SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}