# Configuración del análisis de SonarCloud ejecutado desde GitHub Actions.
sonar.projectKey=OsscarVlc_PlayNSeek-QA
sonar.organization=osscarvlc
sonar.projectName=PlayNSeek-QA

# Código fuente: backend en TypeScript y scripts del front en Handlebars.
sonar.sources=BACKEND/src,FRONTEND/public/js
sonar.exclusions=**/*.test.ts,**/*.test-utils.ts,**/node_modules/**,**/dist/**

# Pruebas: los archivos *.test.ts viven junto al código que prueban.
sonar.tests=BACKEND/src
sonar.test.inclusions=**/*.test.ts,**/*.test-utils.ts

# Reporte de cobertura que genera Jest.
sonar.javascript.lcov.reportPaths=BACKEND/coverage/lcov.info

# Herramientas de QA (seed y scripts de medición): no son código de producción ni llevan pruebas.
# Los scripts del navegador (FRONTEND/public/js) no tienen pruebas unitarias: se cubren con pruebas de sistema.
# index.ts solo arranca la infraestructura (Mongo, Dgraph, Socket.IO, puerto); se valida con las pruebas de sistema.
sonar.coverage.exclusions=BACKEND/scripts/**,qa/**,FRONTEND/public/js/**,BACKEND/src/index.ts
